<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenFGA Playground — ekila-lms-b2c</title>
<style>
  :root {
    --fga-bg: #0f1117;
    --fga-panel: #151821;
    --fga-surface: #1b1f2b;
    --fga-surface-2: #222736;
    --fga-border: #2a3040;
    --fga-text: #f1f5f9;
    --fga-muted: #94a3b8;
    --fga-dim: #64748b;
    --fga-purple: #635dff;
    --fga-purple-hover: #524ce6;
    --fga-violet: #a78bfa;
    --fga-teal: #2dd4bf;
    --fga-green: #10b981;
    --fga-green-bg: #064e3b;
    --fga-red: #f87171;
    --fga-red-bg: #450a0a;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--fga-bg);
    color: var(--fga-text);
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.4;
    overflow: hidden;
  }
  .shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* OpenFGA Header */
  .fga-nav {
    height: 40px;
    background: #0b0d12;
    border-bottom: 1px solid var(--fga-border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .fga-logo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .store-select {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    color: #ffffff;
    padding: 3px 9px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--fga-muted);
    text-transform: uppercase;
  }
  .nav-links span.ok { color: var(--fga-teal); }
  .nav-actions { display: flex; align-items: center; gap: 6px; }
  .btn-fga {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    color: var(--fga-text);
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    font-family: var(--sans);
    text-transform: uppercase;
  }
  .btn-fga:hover { border-color: var(--fga-violet); color: #ffffff; }
  .btn-fga.primary {
    background: var(--fga-purple);
    border-color: var(--fga-purple);
    color: #ffffff;
  }
  .btn-fga.primary:hover { background: var(--fga-purple-hover); }

  /* Split Main Workspace + Left Collapse Toggle */
  .fga-main {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
  }
  .col-left {
    width: 39%;
    min-width: 280px;
    border-right: 1px solid var(--fga-border);
    display: grid;
    grid-template-rows: 45% 55%;
    min-height: 0;
    background: var(--fga-panel);
    transition: width 0.2s ease, min-width 0.2s ease, opacity 0.15s ease;
    overflow: hidden;
    flex-shrink: 0;
  }
  .fga-main.left-collapsed .col-left {
    width: 0;
    min-width: 0;
    border-right: none;
    opacity: 0;
    pointer-events: none;
  }
  .divider-rail {
    width: 14px;
    background: #0e1017;
    border-right: 1px solid var(--fga-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--fga-muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .divider-rail:hover {
    background: var(--fga-surface-2);
    color: #ffffff;
  }
  .divider-btn {
    background: transparent;
    border: none;
    color: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 44px;
  }
  .col-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #0b0d12;
  }

  /* Left Top: Authorization Model */
  .pane-model {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-bottom: 1px solid var(--fga-border);
  }
  .pane-head {
    padding: 5px 10px;
    background: var(--fga-panel);
    border-bottom: 1px solid var(--fga-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }
  .pane-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fga-muted);
  }
  .mode-pills { display: inline-flex; gap: 4px; align-items: center; }
  .mode-pill {
    background: transparent;
    border: 1px solid transparent;
    color: var(--fga-muted);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-pill.active {
    background: var(--fga-surface-2);
    border-color: var(--fga-border);
    color: #ffffff;
  }
  .dsl-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px 10px;
    background: #0e1017;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.45;
    color: #e2e8f0;
  }
  .dsl-line { display: flex; gap: 8px; }
  .dsl-ln { color: #475569; user-select: none; min-width: 16px; text-align: right; }
  .kw { color: #38bdf8; font-weight: 700; }
  .tp { color: #a78bfa; font-weight: 700; }
  .cm { color: #64748b; font-style: italic; }

  /* Left Bottom: Tuples & Assertions */
  .pane-tuples {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--fga-panel);
  }
  .tab-bar {
    padding: 0 10px;
    border-bottom: 1px solid var(--fga-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
    height: 30px;
  }
  .sub-tabs { display: flex; gap: 12px; height: 100%; }
  .sub-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--fga-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    height: 100%;
    padding: 0 2px;
  }
  .sub-tab.active {
    color: #ffffff;
    border-bottom-color: var(--fga-purple);
  }
  .add-trigger {
    background: transparent;
    border: none;
    color: var(--fga-violet);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .add-trigger:hover { color: #ffffff; }
  .add-drawer {
    display: none;
    padding: 6px 8px;
    background: var(--fga-surface);
    border-bottom: 1px solid var(--fga-border);
    gap: 5px;
    flex-shrink: 0;
  }
  .add-drawer.open {
    display: grid;
    grid-template-columns: 1fr 0.9fr 1.15fr auto;
  }
  .fga-input, .fga-select {
    background: #0b0d12;
    border: 1px solid var(--fga-border);
    color: #ffffff;
    border-radius: 4px;
    padding: 3px 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    min-width: 0;
  }
  .fga-input:focus, .fga-select:focus {
    outline: none;
    border-color: var(--fga-purple);
  }
  .tuples-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .tuple-card {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    border-radius: 4px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .tuple-card:hover { border-color: #3f4860; }
  .tuple-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .tuple-line { display: flex; gap: 8px; font-size: 10.5px; align-items: baseline; }
  .tuple-k {
    width: 56px;
    font-size: 9px;
    font-weight: 700;
    color: var(--fga-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .tuple-v {
    font-family: var(--mono);
    color: #f8fafc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tuple-v.rel { color: var(--fga-teal); }
  .tuple-del {
    background: transparent;
    border: 1px solid transparent;
    color: var(--fga-dim);
    cursor: pointer;
    border-radius: 3px;
    padding: 2px 5px;
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .tuple-del:hover { color: var(--fga-red); border-color: #7f1d1d; background: var(--fga-red-bg); }

  .assert-item {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    border-left: 3px solid var(--fga-green);
    border-radius: 4px;
    padding: 5px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
  }
  .assert-item.fail { border-left-color: var(--fga-red); background: #261215; }
  .assert-badge {
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9.5px;
  }
  .assert-badge.pass { background: var(--fga-green-bg); color: #6ee7b7; }
  .assert-badge.fail { background: var(--fga-red-bg); color: #fca5a5; }

  /* Right Top: Types Previewer Radial Graph + Zoom/Pan */
  .graph-pane {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .graph-head {
    padding: 5px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 1px solid #181c26;
  }
  .zoom-controls {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .zoom-btn {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    color: var(--fga-text);
    padding: 2px 7px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .zoom-btn:hover { border-color: var(--fga-violet); color: #ffffff; }
  .zoom-pct {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fga-muted);
    min-width: 38px;
    text-align: center;
  }
  .graph-canvas-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  .graph-canvas-wrap:active { cursor: grabbing; }
  .graph-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .graph-legend {
    position: absolute;
    left: 12px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--fga-muted);
    background: rgba(11, 13, 18, 0.88);
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid var(--fga-border);
    pointer-events: none;
  }
  .lg-row { display: flex; align-items: center; gap: 6px; }
  .lg-dash { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

  /* Right Bottom: Collapsible Tuple Queries Drawer */
  .queries-pane {
    border-top: 1px solid var(--fga-border);
    background: var(--fga-panel);
    padding: 6px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .queries-pane.collapsed .queries-body {
    display: none;
  }
  .queries-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }
  .q-toggle {
    background: transparent;
    border: none;
    color: var(--fga-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .q-toggle:hover { color: #ffffff; }
  .queries-body {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .preset-bar {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: var(--fga-surface);
    border: 1px solid var(--fga-border);
    color: #cbd5e1;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .preset-btn:hover { border-color: var(--fga-violet); color: #ffffff; }
  .query-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .q-lbl {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--fga-muted);
  }
  .query-result {
    background: #0b0d12;
    border: 1px solid var(--fga-border);
    border-radius: 4px;
    padding: 5px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .res-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .res-pill {
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10.5px;
  }
  .res-pill.allow { background: var(--fga-green-bg); color: #6ee7b7; border: 1px solid #047857; }
  .res-pill.deny { background: var(--fga-red-bg); color: #fca5a5; border: 1px solid #991b1b; }
  .trace-line {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.38;
    color: var(--fga-muted);
    white-space: normal;
    word-break: break-word;
  }

  @media (max-width: 780px) {
    .fga-main { flex-direction: column; overflow-y: auto; }
    .col-left { width: 100%; min-width: 0; grid-template-rows: auto auto; border-right: none; border-bottom: 1px solid var(--fga-border); }
    .divider-rail { display: none; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- OpenFGA Header Bar -->
  <header class="fga-nav">
    <div class="nav-left">
      <div class="fga-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke="#ffffff" stroke-width="2" fill="#1b1f2b"/>
          <circle cx="12" cy="12" r="3" fill="#635dff"/>
          <line x1="12" y1="2" x2="12" y2="9" stroke="#2dd4bf" stroke-width="1.6"/>
          <line x1="21" y1="17" x2="14.5" y2="13.5" stroke="#a78bfa" stroke-width="1.6"/>
          <line x1="3" y1="17" x2="9.5" y2="13.5" stroke="#a78bfa" stroke-width="1.6"/>
        </svg>
        <span>OpenFGA</span>
      </div>
      <div class="store-select">ekila-lms-b2c</div>
      <div class="nav-links">
        <span class="ok">REBAC ENGINE READY</span>
        <span>SCHEMA 1.1</span>
        <span>7 TYPES</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-fga" onclick="toggleLeftPanel()" id="btnToggleLeftHeader">ẨN BẢNG TRÁI</button>
      <button class="btn-fga" onclick="resetStore()">RESET (15)</button>
      <button class="btn-fga primary" onclick="showAssertions()">ASSERTIONS (<span id="topAssertBadge">19/19</span>)</button>
    </div>
  </header>

  <!-- Main OpenFGA Split View -->
  <div class="fga-main" id="fgaMain">
    <!-- Left Column: Model + Tuples/Assertions -->
    <section class="col-left" id="colLeft">
      <div class="pane-model">
        <div class="pane-head">
          <span class="pane-title">AUTHORIZATION MODEL (7 TYPES)</span>
          <div class="mode-pills">
            <button class="mode-pill active" id="btnViewDsl" onclick="setModelView('dsl')">DSL</button>
            <button class="mode-pill" id="btnViewJson" onclick="setModelView('json')">JSON</button>
          </div>
        </div>
        <div class="dsl-scroll" id="modelView"></div>
      </div>

      <div class="pane-tuples">
        <div class="tab-bar">
          <div class="sub-tabs">
            <button class="sub-tab active" id="tabBtnTuples" onclick="switchLeftTab('tuples')">Tuples (<span id="tupleCount">15</span>)</button>
            <button class="sub-tab" id="tabBtnAssertions" onclick="switchLeftTab('assertions')">Assertions (<span id="assertCount">19</span>)</button>
          </div>
          <button class="add-trigger" onclick="toggleAddDrawer()">+ ADD TUPLE &gt;</button>
        </div>

        <div class="add-drawer" id="addDrawer">
          <input class="fga-input" id="inUser" value="user:an" placeholder="user:an" title="User" />
          <input class="fga-input" id="inRel" value="enrolled" placeholder="relation" title="Relation" />
          <input class="fga-input" id="inObj" value="course:spring-boot" placeholder="course:spring-boot" title="Object" />
          <button class="btn-fga primary" onclick="addTuple()">SAVE</button>
        </div>

        <div class="tuples-list" id="tuplesContainer"></div>
        <div class="tuples-list" id="assertionsContainer" style="display:none;"></div>
      </div>
    </section>

    <!-- Middle Collapse/Expand Handle (OpenFGA style) -->
    <div class="divider-rail" onclick="toggleLeftPanel()" title="Ẩn / Hiện bảng Model &amp; Tuples bên trái">
      <button class="divider-btn" id="dividerArrow" aria-label="Ẩn bảng trái">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <!-- Right Column: Types Previewer Radial Graph + Tuple Queries -->
    <section class="col-right">
      <div class="graph-pane">
        <div class="graph-head">
          <span class="pane-title">TYPES PREVIEWER</span>
          <span id="graphActiveNote" style="font-family:var(--mono); font-size:10px; color:var(--fga-teal); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Store: ekila-lms-b2c</span>
          <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomGraph(-0.18)" title="Thu nhỏ">-</button>
            <span class="zoom-pct" id="zoomPct">100%</span>
            <button class="zoom-btn" onclick="zoomGraph(0.18)" title="Phóng to">+</button>
            <button class="zoom-btn" onclick="resetGraphView()" title="Đưa đồ thị về giữa">Fit</button>
          </div>
        </div>
        <div class="graph-canvas-wrap" id="graphCanvasWrap">
          <svg class="graph-svg" id="typesGraph" viewBox="0 0 820 460"></svg>
          <div class="graph-legend">
            <div class="lg-row"><span class="lg-dash" style="background:#64748b;"></span><span>STORE</span></div>
            <div class="lg-row"><span class="lg-dash" style="background:#8b5cf6;"></span><span>TYPE</span></div>
            <div class="lg-row"><span class="lg-dash" style="background:#2dd4bf;"></span><span>RELATIONS</span></div>
          </div>
        </div>
      </div>

      <div class="queries-pane" id="queriesPane">
        <div class="queries-head">
          <button class="q-toggle" onclick="toggleQueriesPane()">
            <span>TUPLE QUERIES</span>
            <svg id="qChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="preset-bar">
            <button class="preset-btn" onclick="applyPreset('user:khanh','can_view','lesson:jwt-01')">Khánh học JWT</button>
            <button class="preset-btn" onclick="applyPreset('user:an','can_view','lesson:jwt-01')">An chưa mua</button>
            <button class="preset-btn" onclick="applyPreset('user:an','can_view','lesson:intro-preview')">An học Preview</button>
            <button class="preset-btn" onclick="applyPreset('user:duy','can_manage_questions','quiz:quiz-auth')">Duy sửa Quiz</button>
            <button class="preset-btn" onclick="applyPreset('user:duy','can_edit','course:nextjs-pro')">Duy sửa chéo</button>
            <button class="preset-btn" onclick="applyPreset('user:linh','can_cancel','order:ord-khanh-01')">Linh hủy đơn</button>
          </div>
        </div>

        <div class="queries-body">
          <div class="query-row">
            <span class="q-lbl">is</span>

function evaluateLocal(user, relation, object, visited = new Set()) {
  const key = `${user}|${relation}|${object}`;
  if (visited.has(key)) return { allowed: false, trace: [] };
  visited.add(key);

  const [objType] = object.split(':');
  const typeRules = MODEL_RULES[objType];
  if (!typeRules || !typeRules[relation]) {
    return { allowed: false, trace: [`Relation ${relation} không tồn tại trên type ${objType}`] };
  }

  const misses = [];
  for (const branch of typeRules[relation]) {
    if (branch.kind === 'direct') {
      const found = tuples.filter(t => t.object === object && t.relation === relation);
      const exact = found.find(t => t.user === user);
      if (exact) return { allowed: true, trace: [`${exact.object}#${exact.relation}@${exact.user}`] };
      if (branch.wildcard && user.startsWith('user:')) {
        const wild = found.find(t => t.user === 'user:*');
        if (wild) return { allowed: true, trace: [`${wild.object}#${wild.relation}@user:*`] };
      }
      misses.push(`${object}#${relation}=[${found.map(t => t.user).join(', ') || 'trống'}]`);
    } else if (branch.kind === 'computed') {
      const sub = evaluateLocal(user, branch.rel, object, new Set(visited));
      if (sub.allowed) return { allowed: true, trace: [`${object}#${relation} -> ${branch.rel}`, ...sub.trace] };
      const leaf = (sub.trace[0] || '').replace(/^Checked\s+/, '');
      misses.push(leaf || branch.rel);
    } else if (branch.kind === 'ttu') {
      const parents = tuples.filter(t => t.object === object && t.relation === branch.tupleset);
      if (!parents.length) {
        misses.push(`${object}#${branch.tupleset}=[trống]`);
      }
      for (const p of parents) {
        const sub = evaluateLocal(user, branch.rel, p.user, new Set(visited));
        if (sub.allowed) {
          return { allowed: true, trace: [`${object}#${relation} -> (${branch.tupleset}) ${p.user}#${branch.rel}`, ...sub.trace] };
        }
        const leaf = (sub.trace[0] || '').replace(/^Checked\s+/, '');
        misses.push(leaf || `${p.user}#${branch.rel}`);
      }
    }
  }
  return { allowed: false, trace: [`Checked ${misses.join(' | ')}`] };
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderModelPane() {
  const el = document.getElementById('modelView');

    return;
  }
  el.innerHTML = MODEL_DSL.split('\n').map((line, idx) => {
    const f = escapeHtml(line)
      .replace(/^(\s*)(model|schema|type|relations|define)\b/g, '$1<span class="kw">$2</span>')
      .replace(/\b(or|from)\b/g, '<span class="kw">$1</span>')
      .replace(/(#.*)$/g, '<span class="cm">$1</span>');
    return `<div class="dsl-line"><span class="dsl-ln">${idx + 1}</span><span>${f}</span></div>`;
  }).join('');
}

function polarPt(cx, cy, deg, r) {
  const rad = deg * Math.PI / 180;
  return { x: cx + Math.cos(rad) * r, y: cy + Math.sin(rad) * r };
}

function renderTypesPreviewer(activeQuery) {
  lastActiveQuery = activeQuery || lastActiveQuery;
  const q = lastActiveQuery;
  const svg = document.getElementById('typesGraph');
  if (!svg) return;

  const cx = 410, cy = 230;
  const activeObjType = q ? q.object.split(':')[0] : '';
  const activeRel = q ? q.relation : '';

  // Well-spaced radial sectors matching OpenFGA Playground layout
  const typeSpecs = [
    { name: 'user', x: cx - 54, y: cy, rels: [] },
    { name: 'quiz', ang: -148, r: 108, span: 96, baseD: 82, rels: ['can_attempt', 'can_manage_questions', 'course_reporter', 'parent_course'] },
    { name: 'lesson', ang: -92, r: 102, span: 96, baseD: 82, rels: ['parent_course', 'preview_viewer', 'can_view', 'can_track_progress'] },
    { name: 'course', ang: -6, r: 112, span: 132, baseD: 94, rels: ['can_learn', 'enrolled', 'can_view_content', 'can_view_reports', 'can_edit', 'can_publish', 'platform', 'instructor', 'can_manage_questions'] },
    { name: 'platform', ang: 68, r: 92, span: 54, baseD: 76, rels: ['content_admin', 'system_admin'] },
    { name: 'quiz_attempt', ang: 112, r: 108, span: 84, baseD: 82, rels: ['parent_quiz', 'can_view_result', 'owner', 'can_draft_or_submit'] },
    { name: 'order', ang: 162, r: 118, span: 84, baseD: 82, rels: ['platform', 'can_view', 'buyer', 'can_cancel'] }
  ];

  let inner = '';
  const relCoords = {};

  typeSpecs.forEach(tp => {
    const tPos = tp.x !== undefined ? { x: tp.x, y: tp.y } : polarPt(cx, cy, tp.ang, tp.r);
    const isActiveType = tp.name === activeObjType;

    // Store -> Type solid link
    inner += `<line x1="${cx}" y1="${cy}" x2="${tPos.x}" y2="${tPos.y}" stroke="${isActiveType ? '#a78bfa' : '#334155'}" stroke-width="${isActiveType ? 2.1 : 1.3}"/>`;

    relCoords[tp.name] = {};
    const n = tp.rels.length;
    tp.rels.forEach((rel, i) => {
      const offset = n <= 1 ? 0 : (-tp.span / 2 + (tp.span / (n - 1)) * i);
      const ang = tp.ang + offset;
      // Stagger radial distance smoothly on dense types so text never overlaps
      const dist = tp.baseD + (n > 5 ? (i % 2 === 0 ? 0 : 28) : (i % 2) * 14);
      const rPos = polarPt(tPos.x, tPos.y, ang, dist);
      relCoords[tp.name][rel] = { x: rPos.x, y: rPos.y, ang };
    });
  });

  // 1) Draw dashed dependency curves between relations inside each type (like OpenFGA image 2)
  Object.entries(GRAPH_REL_DEPS).forEach(([typeName, pairs]) => {
    const coords = relCoords[typeName];
    if (!coords) return;
    pairs.forEach(([fromRel, toRel]) => {
      const a = coords[fromRel];
      const b = coords[toRel];
      if (!a || !b) return;
      const isActiveEdge = typeName === activeObjType && (fromRel === activeRel || toRel === activeRel);
      const mx = (a.x + b.x) / 2 + (a.y - b.y) * 0.14;
      const my = (a.y + b.y) / 2 + (b.x - a.x) * 0.14;
      const edgeColor = isActiveEdge ? (q.allowed ? '#10b981' : '#f87171') : '#475569';
      inner += `<path d="M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}" fill="none" stroke="${edgeColor}" stroke-width="${isActiveEdge ? 1.7 : 1}" stroke-dasharray="3 3" opacity="${isActiveEdge ? 0.95 : 0.65}"/>`;
    });
  });

  // 2) Draw Type -> Relation solid links and relation circles + outward-aligned labels
  typeSpecs.forEach(tp => {
    const tPos = tp.x !== undefined ? { x: tp.x, y: tp.y } : polarPt(cx, cy, tp.ang, tp.r);
    const isActiveType = tp.name === activeObjType;

    tp.rels.forEach(rel => {
      const rp = relCoords[tp.name][rel];
      const hitRel = isActiveType && rel === activeRel;
      const lineColor = hitRel ? (q.allowed ? '#10b981' : '#f87171') : '#2e384d';
      const dotColor = hitRel ? (q.allowed ? '#10b981' : '#f87171') : '#2dd4bf';
      inner += `<line x1="${tPos.x}" y1="${tPos.y}" x2="${rp.x}" y2="${rp.y}" stroke="${lineColor}" stroke-width="${hitRel ? 2.2 : 1.1}"/>`;
      inner += `<circle cx="${rp.x}" cy="${rp.y}" r="${hitRel ? 9.5 : 7.5}" fill="${dotColor}" stroke="#0b0d12" stroke-width="1.5"/>`;

      const dy = rp.y < tPos.y ? -12 : 17;
      inner += `<text x="${rp.x}" y="${rp.y + dy}" text-anchor="middle" fill="${hitRel ? '#ffffff' : '#cbd5e1'}" font-size="${hitRel ? 10 : 9}" font-weight="${hitRel ? 700 : 500}" font-family="monospace">${rel}</text>`;
    });

    // Type Circle (purple, matching OpenFGA UI)
    inner += `<circle cx="${tPos.x}" cy="${tPos.y}" r="${isActiveType ? 11.5 : 9.5}" fill="#8b5cf6" stroke="${isActiveType ? '#ffffff' : '#0b0d12'}" stroke-width="1.8"/>`;
    inner += `<text x="${tPos.x}" y="${tPos.y + 20}" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="700" font-family="monospace">${tp.name}</text>`;
  });

  // 3) Center Store Node (large grey circle)
  inner += `<circle cx="${cx}" cy="${cy}" r="14" fill="#64748b" stroke="#0b0d12" stroke-width="2.2"/>`;
  inner += `<text x="${cx}" y="${cy + 25}" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="monospace">ekila-lms-b2c</text>`;

  const bg = `<defs><pattern id="fgaDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.85" fill="#1e2433"/></pattern></defs><rect width="820" height="460" fill="#0b0d12"/><rect width="820" height="460" fill="url(#fgaDots)"/>`;
  svg.innerHTML = bg + `<g id="graphViewport" transform="translate(${graphPanX}, ${graphPanY}) translate(${cx}, ${cy}) scale(${graphScale}) translate(${-cx}, ${-cy})">${inner}</g>`;
}

function updateGraphTransform() {
  const vp = document.getElementById('graphViewport');
  const cx = 410, cy = 230;
  if (vp) {
    vp.setAttribute('transform', `translate(${graphPanX}, ${graphPanY}) translate(${cx}, ${cy}) scale(${graphScale}) translate(${-cx}, ${-cy})`);
  }
  const pct = document.getElementById('zoomPct');
  if (pct) pct.textContent = Math.round(graphScale * 100) + '%';
}

function zoomGraph(delta) {
  graphScale = Math.min(2.6, Math.max(0.5, +(graphScale + delta).toFixed(2)));
  updateGraphTransform();
}

function resetGraphView() {
  graphScale = 1;
  graphPanX = 0;
  graphPanY = 0;
  updateGraphTransform();
}

function setupGraphPanZoom() {
  const wrap = document.getElementById('graphCanvasWrap');
  if (!wrap) return;
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.12 : -0.12;
    zoomGraph(delta);
  }, { passive: false });

  let dragging = false;
  let startX = 0, startY = 0, origX = 0, origY = 0;
  wrap.addEventListener('pointerdown', (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origX = graphPanX;
    origY = graphPanY;
    wrap.setPointerCapture?.(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = wrap.getBoundingClientRect();
    const scaleX = 820 / Math.max(1, rect.width);
    const scaleY = 460 / Math.max(1, rect.height);
    graphPanX = origX + (e.clientX - startX) * scaleX;
    graphPanY = origY + (e.clientY - startY) * scaleY;
    updateGraphTransform();
  });
  const stop = () => { dragging = false; };
  wrap.addEventListener('pointerup', stop);
  wrap.addEventListener('pointercancel', stop);
}

  }
  if (hdrBtn) {
    hdrBtn.textContent = collapsed ? 'HIỆN BẢNG TRÁI' : 'ẨN BẢNG TRÁI';
  }
}

function toggleQueriesPane() {
  const pane = document.getElementById('queriesPane');
  const collapsed = pane.classList.toggle('collapsed');
  const chev = document.getElementById('qChevron');
  if (chev) {
    chev.innerHTML = collapsed
      ? '<polyline points="18 15 12 9 6 15"/>'
      : '<polyline points="6 9 12 15 18 9"/>';
  }
}

function showAssertions() {
  const main = document.getElementById('fgaMain');
  if (main.classList.contains('left-collapsed')) toggleLeftPanel();
  switchLeftTab('assertions');
  runAllAssertions();
}

function toggleAddDrawer() {
  document.getElementById('addDrawer').classList.toggle('open');
}

function switchLeftTab(tab) {
  const isTup = tab === 'tuples';
  document.getElementById('tabBtnTuples').classList.toggle('active', isTup);
  document.getElementById('tabBtnAssertions').classList.toggle('active', !isTup);
  document.getElementById('tuplesContainer').style.display = isTup ? 'flex' : 'none';
  document.getElementById('assertionsContainer').style.display = isTup ? 'none' : 'flex';
}

function addTuple() {
  const user = document.getElementById('inUser').value.trim();
  const relation = document.getElementById('inRel').value.trim();
  const object = document.getElementById('inObj').value.trim();
  if (!user || !relation || !object) return;
  if (!tuples.some(t => t.user === user && t.relation === relation && t.object === object)) {
    tuples.push({ user, relation, object });
  }
  renderTuples();
  runCheck();
  runAllAssertions();
}

function removeTuple(idx) {
  tuples.splice(idx, 1);
  renderTuples();
  runCheck();
  runAllAssertions();
}

function resetStore() {
  tuples = DEFAULT_TUPLES.map(t => ({ ...t }));
  renderTuples();
  runCheck();
  runAllAssertions();
}

function applyPreset(u, r, o) {
  const pane = document.getElementById('queriesPane');
  if (pane.classList.contains('collapsed')) toggleQueriesPane();
  document.getElementById('qUser').value = u;
  document.getElementById('qRel').value = r;
  document.getElementById('qObj').value = o;
  runCheck();
}

function runCheck() {
  const user = document.getElementById('qUser').value;
  const relation = document.getElementById('qRel').value;
  const object = document.getElementById('qObj').value;

  const t0 = performance.now();
  const res = evaluateLocal(user, relation, object);
  const elapsed = performance.now() - t0;
  const msText = elapsed < 0.05 ? '< 0.05 ms' : `${elapsed.toFixed(2)} ms`;

  document.getElementById('resSummary').textContent = `Check(${user}, ${relation}, ${object}) • ${msText}`;
  const pill = document.getElementById('resPill');
  pill.className = 'res-pill ' + (res.allowed ? 'allow' : 'deny');
  pill.textContent = res.allowed ? 'ALLOWED (allowed: true)' : 'DENIED (allowed: false)';

  document.getElementById('resTrace').textContent = 'Traversal: ' + res.trace.join('  =>  ');
  document.getElementById('graphActiveNote').textContent = `${user} -> ${relation}(${object}) = ${res.allowed}`;
  renderTypesPreviewer({ user, relation, object, allowed: res.allowed });
}

function runAllAssertions() {
  let passed = 0;
  document.getElementById('assertionsContainer').innerHTML = ASSERTIONS.map(a => {
    const r = evaluateLocal(a.user, a.relation, a.object);
    const ok = r.allowed === a.expected;
    if (ok) passed++;
    return `
      <div class="assert-item ${ok ? '' : 'fail'}">
        <span>${escapeHtml(a.user)} -> ${escapeHtml(a.relation)}(${escapeHtml(a.object)}) = ${a.expected}</span>
        <span class="assert-badge ${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL (' + r.allowed + ')'}</span>
      </div>
    `;
  }).join('');
  document.getElementById('assertCount').textContent = `${passed}/${ASSERTIONS.length}`;
  document.getElementById('topAssertBadge').textContent = `${passed}/${ASSERTIONS.length}`;
}

if (typeof document !== 'undefined') {
  renderModelPane();
  renderTuples();
  setupGraphPanZoom();
  runCheck();
  runAllAssertions();
}
</script>
</body>
</html>
