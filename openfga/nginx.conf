server {
    listen 3011;
    server_name localhost;

    location / {
        root /usr/share/nginx/slides;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Same-site localhost proxy for OpenFGA Playground UI
    location ~ ^/(sandbox|_next|api|images|favicon\.ico) {
        proxy_pass https://play.fga.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host play.fga.dev;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}

server {
    listen 8092;
    server_name localhost;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Allow-Private-Network "true" always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://openfga:8080;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Private-Network "true" always;
    }
}
